[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tar-pred"
version = "0.1.0"
description = "Inference & evaluation toolkit for TAR prediction models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "joblib",
  "matplotlib",
]

[project.scripts]
tar-predict = "tar_pred.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]